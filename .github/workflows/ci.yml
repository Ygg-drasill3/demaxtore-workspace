name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dmx
          POSTGRES_PASSWORD: dmx_dev
          POSTGRES_DB: dmx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmx -d dmx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dmx:dmx_dev@127.0.0.1:5432/dmx?schema=public
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars
      COOKIE_DOMAIN: localhost
      CORS_ORIGIN: http://127.0.0.1:3000
      PORT: "3001"
      NODE_ENV: test
      EMAIL_PROVIDER: console
      WORKSPACE_BRIDGE_SECRET: ci-workspace-bridge-secret-min-32-chars
      FREIGHTIQ_API_URL: http://127.0.0.1:8000
      FREIGHTIQ_PANEL_URL: https://freightiq.demaxtore.com
      COMMODITYBID_PANEL_URL: https://commoditybid.demaxtore.com
      E2E_API_URL: http://127.0.0.1:3001
      TEST_API_URL: http://127.0.0.1:3001
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn workspace @dmx/backend prisma:generate

      - name: Apply database migrations
        run: yarn workspace @dmx/backend prisma:deploy

      - name: Seed database
        run: yarn workspace @dmx/backend prisma:seed

      - name: Typecheck
        run: yarn typecheck

      - name: Frontend lint
        run: yarn workspace @dmx/frontend lint

      - name: Unit tests (contracts)
        run: yarn workspace @dmx/contracts test

      - name: Backend tests (unit + HTTP integration)
        run: yarn workspace @dmx/backend test

      - name: Unit tests (frontend)
        run: yarn workspace @dmx/frontend test

      - name: Install Playwright browsers
        run: yarn workspace @dmx/e2e exec playwright install --with-deps chromium

      - name: E2E tests
        run: yarn workspace @dmx/e2e test
